[package]
name = "culprit"
version = "0.1.0"
description = "Finds what made your game lag or stutter: your Wi-Fi, your PC, or the server."
edition = "2021"
license = "MIT"
repository = "https://github.com/Kh8da/culprit"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
culpritcore = { path = "../core" }
culprit-capture = { path = "../capture" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
